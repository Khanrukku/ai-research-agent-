<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Research Agent</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #e8edf5; background: #0b1020; }
    body { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .card { background: #121a2b; border: 1px solid #26324a; border-radius: 16px; padding: 24px; margin: 16px 0; }
    textarea { width: 100%; min-height: 110px; box-sizing: border-box; border-radius: 10px; border: 1px solid #33415c; background: #0c1425; color: inherit; padding: 14px; }
    button { margin-top: 12px; padding: 11px 18px; border: 0; border-radius: 9px; cursor: pointer; font-weight: 700; }
    .muted { color: #98a7bf; }
    pre { white-space: pre-wrap; line-height: 1.55; }
    .step { border-left: 3px solid #5b8cff; padding-left: 12px; margin: 14px 0; }
    a { color: #8bb4ff; }
  </style>
</head>
<body>
  <h1>🔬 AI Research Agent</h1>
  <p class="muted">Hybrid academic retrieval + vector RAG + Neo4j knowledge graph.</p>
  <div class="card">
    <label for="goal"><strong>Research question</strong></label>
    <textarea id="goal">Compare retrieval-augmented generation with fine-tuning for domain-specific question answering.</textarea>
    <select id="depth">
      <option value="quick">Quick</option>
      <option value="standard" selected>Standard</option>
      <option value="comprehensive">Comprehensive</option>
    </select>
    <br><button id="run">Run research</button>
    <span id="status" class="muted"></span>
  </div>
  <div id="answer" class="card" hidden></div>
  <div id="steps" class="card" hidden></div>
  <script>
    const run = document.getElementById('run');
    const status = document.getElementById('status');
    const answer = document.getElementById('answer');
    const steps = document.getElementById('steps');
    run.onclick = async () => {
      run.disabled = true; status.textContent = ' Researching…'; answer.hidden = steps.hidden = false;
      answer.innerHTML = '<h2>Answer</h2><p class="muted">Working…</p>'; steps.innerHTML = '<h2>Execution</h2>';
      try {
        const response = await fetch('/api/v1/research', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({goal: document.getElementById('goal').value, depth: document.getElementById('depth').value}) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Request failed');
        answer.innerHTML = '<h2>Answer</h2><pre></pre><h3>Sources</h3><div class="sources"></div>';
        answer.querySelector('pre').textContent = data.answer;
        answer.querySelector('.sources').innerHTML = data.sources.map((s,i)=>`<div>[${i+1}] <a href="${s}" target="_blank" rel="noreferrer">${s}</a></div>`).join('');
        steps.innerHTML = '<h2>Observable execution</h2>' + data.steps.map(s => `<div class="step"><strong>${s.step}. ${s.action}</strong><div>${s.observation}</div><small>${Math.round(s.duration_ms)} ms</small></div>`).join('') + `<p class="muted">Total: ${Math.round(data.total_duration_ms)} ms</p>`;
        status.textContent = ' Done';
      } catch (e) { answer.innerHTML = `<h2>Error</h2><p>${e.message}</p>`; status.textContent = ''; }
      finally { run.disabled = false; }
    };
  </script>
</body>
</html>
